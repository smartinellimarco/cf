[package]
name = "cf"
version = "0.1.0"
edition = "2024"
description = "Rustlings-style Codeforces practice"
license = "MIT"
repository = "https://github.com/smartinellimarco/cf"
homepage = "https://github.com/smartinellimarco/cf"
publish = false

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
notify-debouncer-mini = "0.7.0"
open = "5.4.5"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true
